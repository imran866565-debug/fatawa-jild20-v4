name: Merge Jild 20 tashreeh v4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild20_v4.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json, re
          import merge_jild20_v4 as m
          d = json.load(open('jild-20.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('first id:', items[0]['id'])
          print('last id:', items[-1]['id'])
          exceptions = sorted(it['id'] for it in items if it.get('start_page') != min(it['pages']))
          print('start_page exceptions:', exceptions)
          raw = open('jild-20.json', encoding='utf-8').read()
          SAFHA = "\u0635\u0641\u062d\u06c1"
          LENT = "\u3010" + SAFHA
          print('lenticular markers remaining:', raw.count(LENT))
          print('short markers remaining:', len(re.findall(r"\[\u0635 \d+\]", raw)))
          print('[safha N] markers total:', len(re.findall(r"\[" + SAFHA + r" \d+\]", raw)))
          # Independent re-check of the exact v3 identity (lists embedded in merge script).
          ids = [it['id'] for it in items]
          assert ids == list(m.V3_IDS), 'ID sequence != v3'
          for it in items:
              assert it['pages'] == m.V3_PAGES[it['id']], f"{it['id']}: pages != v3"
          assert len(items) == 255
          assert len(pages) == 530
          assert min(pages) == 5 and max(pages) == 629
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          assert sorted(set(it.get('volume_id') for it in items)) == [44]
          assert exceptions == []
          assert items[0]['id'] == 'jild20-pesh-lafz'
          assert items[-1]['id'] == 'jild20-maakhiz-zamima'
          assert LENT not in raw
          assert not re.search(r"\[\u0635 \d+\]", raw)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-20.json
          gh release create v1.0 jild-20.json --title "Jild 20 tashreeh v4 - merged" --notes "Merged easy-Urdu tashreeh v4 for Fatawa Razviya Jild 20: 255 items, 530 pages (volume_id 44). Generated by merge_jild20_v4.py from the 12 leaf chunk files in order 01, 02, 03, 04, 05, 06, 07, 08, 09, 10, 11, 12 (3 simple joins: masala-23, 192, 242; masala-83 joined from bare-id head + masala-83 tail; masala-203 joined from head + 12 tanbih/tadhyeel tails (risala Hadi al-Adhiyya, 54 pages); masala-293 joined from head + safia-tail; stable sort by start_page); item order reproduces the v3 merged file exactly (first jild20-pesh-lafz, last jild20-maakhiz-zamima). All 12 leaf chunks carry start_page == min(pages). The 5 print-error renames were already applied in the leaves; the 6 joins combine parts into single items. No page markers present in the chunks." || gh release upload v1.0 jild-20.json --clobber
